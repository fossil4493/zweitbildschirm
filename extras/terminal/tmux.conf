# tmux als "Tabs" für foot – per Touch und Maus bedienbar
set -g mouse on                      # Tippen/Wischen/Mausrad an tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm*:RGB"
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g set-titles on
set -g set-titles-string "#{pane_title}"
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# --- Tableiste oben, im Stil der Console-Tabs ---
set -g status-position top
set -g status-justify left
set -g status-style "bg=#2a2a2a,fg=#c0bfbc"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 40
# "+" = neuer Tab (antippbar), rechts die Uhr
set -g status-right "#[range=user|neu,fg=#ffffff,bg=#3d3d3d,bold]  +  #[norange default] #[fg=#77767b]%H:%M "
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#9a9996,bg=#2a2a2a]  #W  "
setw -g window-status-current-format "#[fg=#ffffff,bg=#1e1e1e,bold]  #W  #[range=user|zu,fg=#c0bfbc]× #[norange]"
setw -g window-status-activity-style "fg=#f8e45c"
setw -g monitor-activity on
set -g visual-activity off

# Antippen: Tab wechseln, "+" öffnet neuen Tab, "×" schließt den aktiven Tab
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},neu}' \
    'new-window -c "#{pane_current_path}"' \
    { if -F '#{==:#{mouse_status_range},zu}' 'kill-window' 'select-window -t =' }

# Wischen/Mausrad scrollt im Verlauf (Kopiermodus), Ende des Verlaufs beendet ihn
bind -n WheelUpPane if -F '#{||:#{mouse_any_flag},#{alternate_on}}' 'send -M' 'copy-mode -e; send -M'

# Tastenkürzel wie in Console (Strg+Umschalt+T / Strg+Bild↑↓)
bind -n C-S-t new-window -c "#{pane_current_path}"
bind -n C-PageUp previous-window
bind -n C-PageDown next-window
bind -n C-S-w kill-window

# Markieren mit Maus/Long-Press kopiert in die Zwischenablage (foot unterstützt OSC 52)
set -g set-clipboard on

# Pane-Rahmen dezent
set -g pane-border-style "fg=#3d3d3d"
set -g pane-active-border-style "fg=#3584e4"
set -g message-style "bg=#3d3d3d,fg=#ffffff"

# Strg+Umschalt-Kürzel aus foot durchreichen
set -s extended-keys on
set -as terminal-features ",foot*:extkeys"

# Jedes foot-Fenster = eigene Sitzung; Fenster zu -> Sitzung weg (wie bei Console)
set -g destroy-unattached on
