# foot – an GNOME Console (Farbschema "Night") angelehnt, für Touch auf dem Tablet
[main]
font=Adwaita Mono:size=11
pad=8x6
initial-color-theme=dark
shell=tmux new-session

[scrollback]
lines=10000

[touch]
# Wischen = scrollen, kurz halten und ziehen = Text markieren
long-press-delay=400

[csd]
preferred=client
size=34

